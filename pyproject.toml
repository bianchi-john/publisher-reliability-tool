[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publisher-reliability-tool"
version = "0.1.0"
description = "Local research demo for inspecting article predictions and publisher aggregation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "idna==3.10",
  "langdetect==1.0.9",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
models = [
  "lxml-html-clean==0.4.3",
  "newspaper3k==0.2.8",
  "safetensors==0.8.0",
  "torch==2.7.1",
  "transformers==4.53.2",
]
# Dependencies of the prepared extension point for large decoder models. That
# import path is refused in this release, so nothing installed here is reachable
# from a user-facing path yet; the pins are kept so the family can be enabled
# without re-resolving the locked environment.
llm-models = [
  "accelerate==1.9.0",
  "bitsandbytes==0.46.1",
  "lxml-html-clean==0.4.3",
  "newspaper3k==0.2.8",
  "peft==0.18.1",
  "safetensors==0.8.0",
  "torch==2.7.1",
  "transformers==4.53.2",
]
test = [
  "pytest==8.4.1",
]

[project.scripts]
publisher-reliability = "publisher_reliability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
publisher_reliability = ["frontend/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
