<header class="page-head">
  <div>
    <div class="eyebrow">Article classification</div>
    <h1>Evaluate</h1>
    <p class="intro">Classify one article. A publisher's class is not created here: it is read from the articles already classified, under Publishers.</p>
  </div>
</header>

<section class="card full">
  <form id="evaluation">
    <div class="row">
      <label class="grow">Article URL<input required name="url" type="url" placeholder="https://publisher.example/article"></label>
    </div>
    <div class="row evaluation-options">
      <label>Available model<select required disabled name="model_id"><option value="">Enter a URL first</option></select></label>
    </div>
    <div id="model-availability" class="notice" aria-live="polite">Models will be detected from stored predictions for this article.</div>
    <div class="row evaluation-actions"><button disabled>Start evaluation</button></div>
  </form>
  <div id="evaluation-result" aria-live="polite"></div>
</section>
